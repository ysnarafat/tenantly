name: tenantly

services:
  # PostgreSQL Database (Internal Only - No Public Access)
  postgres:
    image: postgres:18.0-alpine
    container_name: tenantly-postgres
    environment:
      POSTGRES_DB: tenantly
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-in-production}
    # NO PORTS EXPOSED - Database is internal only
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - tenantly-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Go API Service
  api:
    build:
      context: ./src/backend/api
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: tenantly-api
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tenantly-network
    volumes:
      - ./src/backend/api/migrations:/app/migrations
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Angular Frontend
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: tenantly-frontend
    expose:
      - "8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - tenantly-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: tenantly-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - tenantly-network
    restart: unless-stopped

  # C# Notification Service
  notification-service:
    build:
      context: ./src/backend/notification-service
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: tenantly-notification-service
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Database=tenantly;Username=postgres;Password=${POSTGRES_PASSWORD:-change-this-in-production}
      Notifications__ProcessingIntervalSeconds: 30
      Notifications__Sms__Provider: ${SMS_PROVIDER:-ssl_wireless}
      Notifications__Sms__ApiKey: ${SMS_API_KEY:-}
      Notifications__Sms__ApiUrl: ${SMS_API_URL:-https://smsplus.sslwireless.com/api/v3/send-sms}
      Notifications__Sms__SenderId: ${SMS_SENDER_ID:-TENANTLY}
      Notifications__Email__SmtpHost: ${SMTP_HOST:-smtp.gmail.com}
      Notifications__Email__SmtpPort: ${SMTP_PORT:-587}
      Notifications__Email__Username: ${SMTP_USERNAME:-}
      Notifications__Email__Password: ${SMTP_PASSWORD:-}
      Notifications__Email__FromEmail: ${FROM_EMAIL:-noreply@tenantly.com}
    depends_on:
      - postgres
    networks:
      - tenantly-network
    volumes:
      - ./notification-logs:/app/logs

volumes:
  postgres_data:
  notification-logs:

networks:
  tenantly-network:
    driver: bridge