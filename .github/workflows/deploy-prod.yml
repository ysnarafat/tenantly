name: Deploy to Production Server

on:
  push:
    branches:
      - main

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      - name: Copy files to prod server
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" ./ ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}:/home/${{ secrets.PROD_USER }}/tenantly/

      - name: Deploy with Docker Compose
        run: |
          ssh ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} "
            cd /home/${{ secrets.PROD_USER }}/tenantly &&
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull &&
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
          "
