services:
  api:
    container_name: tenantly-api-dev    
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/tenantly?sslmode=disable
      JWT_SECRET: your-secret-key-change-in-production
      JWT_EXPIRATION: 8h
      ENVIRONMENT: development
    volumes:
      - ./src/backend/api:/app
      - ./src/backend/api/migrations:/app/migrations

  frontend:
    container_name: tenantly-frontend-dev
    environment:
      - NODE_ENV=development

  nginx:
    container_name: tenantly-nginx-dev
    ports:
      - "8081:80"
