services:
  api:
    container_name: tenantly-api-dev    
    environment:
      # Must match postgres's own POSTGRES_PASSWORD default in
      # docker-compose.yml — a different fallback here than there means
      # Postgres gets initialized with one password while the API tries to
      # connect with another whenever POSTGRES_PASSWORD isn't actually set,
      # which is a guaranteed, permanent auth failure (not a startup race).
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-change-this-in-production}@postgres:5432/tenantly?sslmode=disable
      JWT_SECRET: your-secret-key-change-in-production
      JWT_EXPIRATION: 8h
      ENVIRONMENT: development
    volumes:
      - ./src/backend/api/migrations:/app/migrations

  frontend:
    container_name: tenantly-frontend-dev
    build:
      args:
        # NOT "development" — that's ng serve's local-machine configuration
        # (baked-in http://localhost:8080/api/v1, correct only when there's
        # no nginx in front and the API runs on the same machine as the
        # browser). This container always sits behind nginx, which already
        # proxies /api/ on the same origin, so it needs the relative apiUrl
        # instead — see angular.json's "container-dev" configuration.
        BUILD_CONFIGURATION: container-dev
    environment:
      - NODE_ENV=development

  nginx:
    container_name: tenantly-nginx-dev
    ports:
      - "8081:80"
