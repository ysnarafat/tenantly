<div class="dt-wrapper">
  @if (loading) {
  <app-loading-spinner [message]="loadingMessage"></app-loading-spinner>
  }

  <div class="dt-table-container" [class.dt-hidden]="isEmpty || loading">
    <table
      mat-table
      [dataSource]="internalDataSource"
      matSort
      (matSortChange)="sortChange.emit($event)"
      class="dt-table"
    >
      <ng-content></ng-content>
      <tr mat-header-row *matHeaderRowDef="renderedColumns; sticky: stickyHeader"></tr>
      <tr mat-row *matRowDef="let row; columns: renderedColumns" class="dt-row"></tr>
    </table>
  </div>

  @if (isEmpty) {
  <div class="dt-empty">
    <mat-icon>{{ emptyIcon }}</mat-icon>
    <h3>{{ emptyMessage }}</h3>
    @if (emptySubtitle) {
    <p>{{ emptySubtitle }}</p>
    }
    <ng-content select="[dtEmptyAction]"></ng-content>
  </div>
  } @if (showPaginator) {
  <mat-paginator
    [pageSizeOptions]="pageSizeOptions"
    showFirstLastButtons
    (page)="pageChange.emit($event)"
  ></mat-paginator>
  }
</div>
