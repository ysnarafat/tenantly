<div class="error-bg">
  <div class="brand-header">
    <mat-icon class="brand-icon">apartment</mat-icon>
    <span class="brand-name">TENANTLY</span>
  </div>

  <div class="board-wrap">
    <div class="rope rope-left"></div>
    <div class="rope rope-right"></div>

    <div class="board">
      <span class="nail nail-left"></span>
      <span class="nail nail-right"></span>

      <div class="board-inner">
        <div class="to-let-stamp">
          <span class="to-let-text">TO&ndash;LET</span>
          <span class="strike"></span>
        </div>

        <h1 class="code">404</h1>
        <p class="headline">THIS ADDRESS DOESN'T EXIST</p>
        <p class="subtext">
          The page you're looking for isn't listed anywhere in Tenantly. Check the URL, or use one
          of the routes below.
        </p>

        <div class="contact-strip">
          <a class="strip-link" [routerLink]="homeLink">{{
            homeLink === '/dashboard' ? 'Dashboard' : 'Login'
          }}</a>
          <span class="strip-divider">&bull;</span>
          <button type="button" class="strip-link strip-btn" (click)="goBack()">Go back</button>
        </div>
      </div>
    </div>
  </div>

  <p class="footer-note">Tenantly &mdash; Property Management</p>
</div>
