events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS (127.0.0.11) + a variable in proxy_pass makes
    # nginx resolve "api"/"frontend" lazily per-request instead of once at
    # startup — a named `upstream {}` block (the previous approach here)
    # resolves at config load/reload time only, so this container refused
    # to start at all ("host not found in upstream") whenever it started
    # before/without those services being up, taking the whole reverse
    # proxy down with it.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;

        location /api/ {
            # Payment attachment uploads are capped at 10MB by the API
            # (models.MaxAttachmentFileSize); nginx's own default of 1MB
            # would otherwise reject those uploads with 413 before they
            # ever reach it. Sized with headroom for multipart framing
            # overhead, matching the backend's own margin.
            client_max_body_size 12M;

            set $api_upstream http://api:8080;
            # $request_uri: nginx's usual "replace the matched location
            # prefix with the proxy_pass URI" behavior doesn't apply once
            # the target is a variable — without appending the original URI
            # explicitly here, every request forwards as just "/api/",
            # dropping everything after it.
            proxy_pass $api_upstream$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            set $frontend_upstream http://frontend:8080;
            proxy_pass $frontend_upstream$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for development (Angular/HMR)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
