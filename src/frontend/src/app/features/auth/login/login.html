<div class="login-bg">
  <!-- Brand logo above card -->
  <div class="brand-header">
    <mat-icon class="brand-icon">apartment</mat-icon>
    <span class="brand-name">TENANTLY</span>
  </div>

  <mat-card class="login-card">
    <h2 class="welcome-title">Welcome Back!</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>{{ 'LOGIN.FIELDS.USERNAME' | translate }}</mat-label>
        <mat-icon matPrefix>mail_outline</mat-icon>
        <input matInput formControlName="username" required autocomplete="username" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>{{ 'LOGIN.FIELDS.PASSWORD' | translate }}</mat-label>
        <mat-icon matPrefix>lock_outline</mat-icon>
        <input
          matInput
          [type]="showPassword ? 'text' : 'password'"
          formControlName="password"
          required
          autocomplete="current-password"
        />
        <button mat-icon-button matSuffix type="button" (click)="showPassword = !showPassword">
          <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>

      <div class="meta-row">
        <label class="remember-label">
          <input type="checkbox" [(ngModel)]="rememberMe" [ngModelOptions]="{ standalone: true }" />
          <span>Remember me</span>
        </label>
        <a class="forgot-link" href="#">Forgot password?</a>
      </div>

      <button
        mat-flat-button
        type="submit"
        class="login-btn"
        [disabled]="loginForm.invalid || loading()"
      >
        @if (loading()) {
        <mat-spinner diameter="22"></mat-spinner>
        } @else { {{ 'LOGIN.BUTTONS.LOGIN' | translate }} }
      </button>

      @if (error()) {
      <p class="error-msg">{{ $any(error()) }}</p>
      }
    </form>

    <div class="signup-row">
      <span>Don't have an account?</span>
      <a class="signup-link" href="#">Sign Up</a>
    </div>
  </mat-card>
</div>
