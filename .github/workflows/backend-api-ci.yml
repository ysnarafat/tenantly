name: Backend API CI

on:
  pull_request:
    branches:
      - '**'
    paths:
      - 'src/backend/api/**'
      - '.github/workflows/backend-api-ci.yml'

jobs:
  lint-format-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: p@ssw0rd
          POSTGRES_DB: tenantly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: src/backend/api/go.sum

      - name: Run go fmt check
        working-directory: src/backend/api
        run: |
          if [ -n "$(gofmt -s -l .)" ]; then
            echo "Go code is not formatted:"
            gofmt -s -d .
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: src/backend/api
          version: latest
          args: --timeout=5m

      - name: Run go vet
        working-directory: src/backend/api
        run: go vet ./...

      - name: Download dependencies
        working-directory: src/backend/api
        run: go mod download

      - name: Run tests
        working-directory: src/backend/api
        run: go test -v ./internal/...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        working-directory: src/backend/api
        run: govulncheck ./...

      - name: Build
        working-directory: src/backend/api
        run: go build -o ./tmp/main ./cmd/server
