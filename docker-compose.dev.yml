version: '3.9'

services:
  api:
    extends:
      file: docker-compose.yml
      service: api
    environment:
      ENVIRONMENT: development
    ports:
      - "8080:8080"
    volumes:
      - ./backend/api:/app
      - ./backend/api/migrations:/app/migrations

  frontend:
    extends:
      file: docker-compose.yml
      service: frontend
    ports:
      - "4200:80"

  postgres:
    extends:
      file: docker-compose.yml
      service: postgres
    ports:
      - "5432:5432"
