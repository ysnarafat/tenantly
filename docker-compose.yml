version: '3.9'
name: tenantly

services:
  # PostgreSQL Database
  postgres:
    image: postgres:18.0-alpine
    container_name: tenantly-postgres
    environment:
      POSTGRES_DB: tenantly
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - tenantly-network

  # Go API Service
  api:
    build:
      context: ./src/backend/api
      dockerfile: Dockerfile
    container_name: tenantly-api
    expose:
      - "8080"
    depends_on:
      - postgres
    networks:
      - tenantly-network
    volumes:
      - ./src/backend/api/migrations:/app/migrations

  # Angular Frontend
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: tenantly-frontend
    expose:
      - "80"
    depends_on:
      - api
    networks:
      - tenantly-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: tenantly-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - tenantly-network

  # C# Notification Service
  notification-service:
    build:
      context: ./src/backend/notification-service
      dockerfile: Dockerfile
    container_name: tenantly-notification-service
    environment:
      Database__ConnectionString: Host=postgres;Database=tenantly;Username=postgres;Password=password
      Notifications__ProcessingIntervalSeconds: 30
    depends_on:
      - postgres
    networks:
      - tenantly-network
    volumes:
      - ./notification-logs:/app/logs

volumes:
  postgres_data:
  notification-logs:

networks:
  tenantly-network:
    driver: bridge