<div class="app-container" *ngIf="authService.isAuthenticated(); else loginView">
  <mat-toolbar color="primary">
    <button mat-icon-button (click)="sidenav.toggle()">
      <mat-icon>menu</mat-icon>
    </button>
    <span>Tenantly</span>
    <span class="spacer"></span>
    <button mat-button (click)="logout()">
      <mat-icon>logout</mat-icon>
      Logout
    </button>
  </mat-toolbar>

  <mat-sidenav-container class="sidenav-container">
    <mat-sidenav #sidenav mode="side" opened class="sidenav">
      <mat-nav-list>
        <a mat-list-item routerLink="/dashboard">
          <mat-icon>dashboard</mat-icon>
          <span>Dashboard</span>
        </a>
        <a mat-list-item routerLink="/shops">
          <mat-icon>store</mat-icon>
          <span>Shops</span>
        </a>
        <a mat-list-item routerLink="/tenants">
          <mat-icon>people</mat-icon>
          <span>Tenants</span>
        </a>
        <a mat-list-item routerLink="/payments">
          <mat-icon>payment</mat-icon>
          <span>Payments</span>
        </a>
        <a mat-list-item routerLink="/reports">
          <mat-icon>assessment</mat-icon>
          <span>Reports</span>
        </a>
        <a mat-list-item routerLink="/users" *ngIf="isAdmin()">
          <mat-icon>admin_panel_settings</mat-icon>
          <span>Users</span>
        </a>
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content class="main-content">
      <router-outlet></router-outlet>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>

<ng-template #loginView>
  <router-outlet></router-outlet>
</ng-template>
